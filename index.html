<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A5D46" />
    <title>Fin Money — учёт доходов, расходов и накоплений</title>
    <meta
      name="description"
      content="Fin Money помогает следить за доходами и расходами, анализировать траты по категориям, копить на цели и управлять накопительным счётом."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Превью ссылки в мессенджерах и соцсетях -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fin-money-app.netlify.app/" />
    <meta property="og:image" content="https://fin-money-app.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fin Money — управляй деньгами, достигай целей" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Fin Money" />
    <meta property="og:title" content="Fin Money — учёт доходов, расходов и накоплений" />
    <meta
      property="og:description"
      content="Следите за доходами и расходами, анализируйте траты и достигайте финансовых целей."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://fin-money-app.netlify.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!--
      Экран загрузки: виден, пока браузер скачивает скрипты приложения
      (в режиме разработки первый запуск может занять до минуты).
      Стили здесь, а не в Tailwind: CSS приложения подключается вместе со скриптами.
      Цвета — из src/theme/colors.js (surface, brand, brand.soft, ink.muted).
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #f8f9fa;
      }
      .boot {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: Manrope, system-ui, sans-serif;
        color: #656b74;
      }
      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #cfe3d8;
        border-top-color: #1a5d46;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 2.4s;
        }
      }
      .boot-hint {
        display: none;
        max-width: 320px;
        text-align: center;
        font-size: 14px;
      }
      .boot.is-slow .boot-hint {
        display: block;
      }
      .boot-diag {
        margin: 16px auto 0;
        max-width: 90vw;
        white-space: pre-wrap;
        word-break: break-all;
        text-align: left;
        font-size: 11px;
        line-height: 1.5;
        color: #656b74;
      }
      /* При ошибке индикатор загрузки уже не нужен */
      .boot.is-failed .boot-spinner {
        display: none;
      }
      /* Тёмная тема экрана загрузки (цвета из palettes.dark в src/theme/colors.js) */
      html.dark,
      html.dark body {
        background: #111715;
      }
      html.dark .boot {
        color: #8e9a94;
      }
      html.dark .boot-spinner {
        border-color: #24443a;
        border-top-color: #2e9470;
      }
      .boot-reload {
        margin-top: 12px;
        border: 0;
        border-radius: 999px;
        padding: 10px 24px;
        background: #1a5d46;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- React заменит содержимое #root, когда приложение загрузится -->
    <div id="root">
      <div class="boot" id="boot" role="status">
        <div class="boot-spinner" aria-hidden="true"></div>
        <span>Загружаем Fin Money…</span>
        <div class="boot-hint">
          <span id="boot-hint-text">Загрузка занимает больше обычного.</span>
          <br />
          <button type="button" class="boot-reload" onclick="window.__finMoneyBootReload()">Обновить</button>
          <pre class="boot-diag" id="boot-diag" hidden></pre>
        </div>
      </div>
    </div>
    <noscript>Для работы Fin Money включите JavaScript.</noscript>
    <script>
      // Тема до загрузки приложения, чтобы тёмная тема не «мигала» светлой.
      // Настройка хранится вместе с данными (ключ как в src/context/financeStorage.js).
      (function () {
        var theme = 'system';
        try {
          theme = JSON.parse(localStorage.getItem('fin-money:demo:v2')).settings.theme || theme;
        } catch (e) {
          // нет сохранения — как в системе
        }
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <script>
      // Страховка экрана загрузки: приложение не должно «висеть» на нём без объяснений.
      // Если скрипты не загрузились (например, dev-сервер пересобирал зависимости прямо во время
      // загрузки), сами пробуем ещё раз с паузами, а потом показываем кнопку «Обновить».
      // Какие файлы не загрузились — пишем в консоль браузера, чтобы причину было видно.
      (function () {
        var RETRY_KEY = 'fin-money:boot-retry';
        var SLOW_AFTER_MS = 20000;
        // Паузы перед автоматическими повторами: даём серверу закончить пересборку
        var RETRY_DELAYS_MS = [1500, 4000, 8000];

        var readRetries = function () {
          try {
            return Number(sessionStorage.getItem(RETRY_KEY)) || 0;
          } catch (e) {
            return RETRY_DELAYS_MS.length; // хранилище недоступно — без автоповторов
          }
        };
        var writeRetries = function (count) {
          try {
            if (count) sessionStorage.setItem(RETRY_KEY, String(count));
            else sessionStorage.removeItem(RETRY_KEY);
          } catch (e) {
            // хранилище недоступно — ничего страшного
          }
        };

        var showHint = function (text) {
          var boot = document.getElementById('boot');
          if (!boot) return; // приложение уже отрисовалось
          if (text) {
            document.getElementById('boot-hint-text').textContent = text;
            boot.classList.add('is-failed');
          }
          boot.classList.add('is-slow');
        };

        // Файлы этого сайта, которые не загрузились (код ответа 400+ или обрыв соединения)
        var failedResources = function () {
          return performance
            .getEntriesByType('resource')
            .filter(function (e) {
              return e.name.indexOf(location.origin) === 0 && (e.responseStatus >= 400 || e.responseEnd === 0);
            })
            .map(function (e) {
              return (e.responseStatus || 'нет ответа') + ' ' + e.name.replace(location.origin, '');
            });
        };

        window.__finMoneyBootFailed = function () {
          // Файл открыт из папки (file://): без dev-сервера скрипты не загрузятся, повторы бесполезны
          if (location.protocol === 'file:') {
            showHint('Страница открыта из папки, а не через сервер. Запустите в папке проекта «npm run dev» и откройте http://localhost:5173/');
            return;
          }
          var retries = readRetries();
          console.error('[Fin Money] скрипты приложения не загрузились, попытка ' + (retries + 1), failedResources());
          if (retries < RETRY_DELAYS_MS.length) {
            writeRetries(retries + 1);
            document.querySelector('#boot > span').textContent = 'Повторяем загрузку…';
            setTimeout(function () {
              location.reload();
            }, RETRY_DELAYS_MS[retries]);
            return;
          }
          showHint('Не удалось загрузить приложение. Проверьте, что dev-сервер запущен, и обновите страницу.');
          showDiagnostics();
        };

        // Подробности сбоя прямо на экране: какие файлы не загрузились и что отвечает сервер
        var showDiagnostics = function () {
          var box = document.getElementById('boot-diag');
          var lines = failedResources().slice(0, 6);
          var render = function () {
            box.textContent = lines.join('\n');
            box.hidden = false;
          };
          if (lines.length) {
            render();
            return;
          }
          // Явных ошибок нет — проверяем главный скрипт приложения напрямую
          fetch('/src/main.jsx', { cache: 'no-store' })
            .then(function (res) {
              lines.push('main.jsx: ' + res.status + ' ' + (res.headers.get('content-type') || 'без типа'));
            })
            .catch(function (err) {
              lines.push('main.jsx: ' + err.message);
            })
            .then(function () {
              lines.push(navigator.userAgent);
              render();
            });
        };

        // Кнопка «Обновить»: заново разрешаем автоповторы
        window.__finMoneyBootReload = function () {
          writeRetries(0);
          location.reload();
        };

        // Приложение отрисовалось — сбрасываем счётчик автоповторов
        window.__finMoneyBootDone = function () {
          writeRetries(0);
        };

        setTimeout(function () {
          showHint();
        }, SLOW_AFTER_MS);
      })();
    </script>
    <script type="module" src="/src/main.jsx" onerror="window.__finMoneyBootFailed()"></script>
  </body>
</html>
